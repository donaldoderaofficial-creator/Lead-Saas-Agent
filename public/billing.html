<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lead SaaS billing</title>
  <style>body{margin:0;padding:32px 18px;background:#0b0d12;color:#e7e9ee;font:15px/1.5 sans-serif}.wrap{max-width:620px;margin:auto}.panel{background:#151822;border:1px solid #303747;border-radius:12px;padding:24px}h1{margin-top:0}label{display:block;color:#9aa1b1;font-size:13px;margin:12px 0 5px}input,select,button{width:100%;box-sizing:border-box;padding:11px;border-radius:8px;border:1px solid #303747;background:#1c202c;color:#e7e9ee;font:inherit}button{margin-top:16px;background:#6c8cff;border-color:#6c8cff;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wallet{margin-top:18px;padding:14px;background:#1c202c;border-radius:8px;word-break:break-word}#status{min-height:24px;margin-top:16px;color:#9aa1b1}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style>
</head>
<body>
  <main class="wrap"><div class="panel">
    <h1>Lead SaaS subscription</h1>
    <p>Pay by BTC or ETH. Service access is enabled only after transaction review.</p>
    <div class="grid">
      <div><label for="name">Name</label><input id="name"></div>
      <div><label for="email">Email</label><input id="email" type="email"></div>
      <div><label for="plan">Plan</label><select id="plan"><option value="starter">Starter</option><option value="growth">Growth</option></select></div>
      <div><label for="method">Payment method</label><select id="method"><option value="bitcoin">Bitcoin (BTC)</option><option value="ethereum">Ethereum (ETH)</option></select></div>
    </div>
    <button id="order">Create wallet payment</button>
    <div id="wallet" class="wallet" hidden></div>
    <label id="hashLabel" for="hash" hidden>Transaction hash</label>
    <input id="hash" placeholder="Paste transaction hash" hidden>
    <button id="confirm" hidden>Submit payment for review</button>
    <div id="status"></div>
  </div></main>
  <script>
    const $ = (id) => document.getElementById(id);
    let reference = '';
    let amountCrypto = '';
    function status(message, isError = false) {
      $('status').textContent = message;
      $('status').style.color = isError ? '#ff7373' : '#9aa1b1';
    }
    $('order').onclick = async () => {
      status('Creating wallet payment...');
      const response = await fetch('/api/billing/crypto/order', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: $('name').value, email: $('email').value, plan: $('plan').value, method: $('method').value }) });
      const data = await response.json();
      if (!response.ok) return status(data.error || 'Could not create payment.', true);
      reference = data.reference;
      amountCrypto = data.amountCrypto;
      $('wallet').hidden = false;
      $('wallet').innerHTML = `Send exactly <strong>${data.amountCrypto} ${data.currency}</strong> to <strong>${data.walletAddress}</strong>.<br>Reference: ${data.reference}`;
      $('hashLabel').hidden = false;
      $('hash').hidden = false;
      $('confirm').hidden = false;
      status('Send the amount, then submit the transaction hash.');
    };
    $('confirm').onclick = async () => {
      const response = await fetch('/api/billing/crypto/confirm', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ reference, txHash: $('hash').value.trim(), amount: amountCrypto, plan: $('plan').value, method: $('method').value }) });
      const data = await response.json();
      status(response.ok ? 'Payment submitted. Access starts after verification.' : (data.error || 'Could not submit payment.'), !response.ok);
    };
  </script>
</body>
</html>
