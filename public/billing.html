<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lead SaaS billing</title>
  <style>body{margin:0;padding:32px 18px;background:#0b0d12;color:#e7e9ee;font:15px/1.5 sans-serif}.wrap{max-width:620px;margin:auto}.panel{background:#151822;border:1px solid #303747;border-radius:12px;padding:24px;margin-bottom:16px}h1{margin-top:0}label{display:block;color:#9aa1b1;font-size:13px;margin:12px 0 5px}input,select,button{width:100%;box-sizing:border-box;padding:11px;border-radius:8px;border:1px solid #303747;background:#1c202c;color:#e7e9ee;font:inherit}button{margin-top:16px;background:#6c8cff;border-color:#6c8cff;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wallet{margin-top:18px;padding:14px;background:#1c202c;border-radius:8px;word-break:break-word}.wallet-list{display:grid;gap:10px;margin:16px 0}.wallet-row{padding:12px;background:#1c202c;border:1px solid #303747;border-radius:8px}.wallet-row strong{display:block;margin-bottom:4px}.wallet-row code{display:block;color:#b9c7ff;word-break:break-all}.wallet-row button{width:auto;margin:8px 0 0;padding:6px 10px}.card-plan{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.card-plan>div{border:1px solid #303747;border-radius:8px;padding:14px}.card-plan h2{font-size:16px;margin:0 0 4px}.card-plan p{color:#9aa1b1;font-size:13px;margin:0 0 10px}.paypal-button{min-height:42px}#status{min-height:24px;margin-top:16px;color:#9aa1b1}@media(max-width:560px){.grid,.card-plan{grid-template-columns:1fr}}</style>
</head>
<body>
  <main class="wrap"><div class="panel">
    <h1>Lead SaaS subscription</h1>
    <p>Pay by BTC or ETH. Service access is enabled only after payment review.</p>
    <div class="grid">
      <div><label for="name">Name</label><input id="name"></div>
      <div><label for="email">Email</label><input id="email" type="email"></div>
      <div><label for="plan">Plan</label><select id="plan"><option value="starter">Starter</option><option value="growth">Growth</option></select></div>
      <div><label for="method">Payment method</label><select id="method"><option value="bitcoin">Bitcoin (BTC)</option><option value="ethereum">Ethereum (ETH)</option></select></div>
    </div>
    <button id="order" disabled>Create payment</button>
    <div id="walletList" class="wallet-list" aria-live="polite"></div>
    <div id="wallet" class="wallet" hidden></div>
    <label id="hashLabel" for="hash" hidden>Transaction hash</label>
    <input id="hash" placeholder="Paste transaction hash" hidden>
    <button id="confirm" hidden>Submit payment for review</button>
    <div id="status"></div>
  </div></main>
  <section class="wrap panel" id="cardPanel" hidden>
    <h2>Pay by card</h2>
    <p>Use the hosted PayPal checkout to pay by debit or credit card on a recurring monthly plan. Dispatch Pro never stores card details.</p>
    <div class="card-plan">
      <div><h2>Starter</h2><p>$79/month</p><div class="paypal-button" id="paypal-starter"></div></div>
      <div><h2>Growth</h2><p>$249/month</p><div class="paypal-button" id="paypal-growth"></div></div>
    </div>
  </section>
  <script>
    const $ = (id) => document.getElementById(id);
    let reference = '';
    let amountCrypto = '';
    const referral = new URLSearchParams(window.location.search).get('ref') || '';
    const configuredMethods = new Set();
    function status(message, isError = false) {
      $('status').textContent = message;
      $('status').style.color = isError ? '#ff7373' : '#9aa1b1';
    }
    async function loadPaymentOptions() {
      try {
        let response;
        for (let attempt = 0; attempt < 3; attempt += 1) {
          try {
            response = await fetch('/api/payments/options', { cache: 'no-store' });
            if (response.ok) break;
          } catch {}
          if (attempt < 2) await new Promise((resolve) => setTimeout(resolve, 400 * (attempt + 1)));
        }
        if (!response?.ok) throw new Error('Payment options request failed');
        const data = await response.json();
        const wallets = [data.providers.bitcoin, data.providers.ethereum]
          .filter((provider) => provider?.enabled && provider.address);
        $('walletList').innerHTML = wallets.map((provider) => `<div class="wallet-row"><strong>${provider.currency} wallet</strong><code>${provider.address}</code><button type="button" data-address="${provider.address}" data-currency="${provider.currency}">Copy ${provider.currency} address</button></div>`).join('');
        $('walletList').querySelectorAll('button').forEach((button) => {
          button.onclick = async () => {
            try {
              await navigator.clipboard.writeText(button.dataset.address);
              button.textContent = 'Copied';
            } catch {
              button.textContent = 'Copy failed';
            }
            setTimeout(() => { button.textContent = `Copy ${button.dataset.currency} address`; }, 2000);
          };
        });
        for (const option of $('method').options) {
          const provider = option.value === 'bitcoin' ? data.providers.bitcoin : data.providers.ethereum;
          option.hidden = !provider?.enabled;
          option.disabled = !provider?.enabled;
          if (provider?.enabled) configuredMethods.add(option.value);
        }
        const firstAvailable = [...configuredMethods][0];
        if (firstAvailable) {
          $('method').value = firstAvailable;
          $('order').disabled = false;
        } else {
          status('No wallet payment method is configured yet.', true);
        }
      } catch {
        status('Payment options are temporarily unavailable. Please try again later.', true);
      }
    }
    async function loadCardCheckout() {
      try {
        const response = await fetch('/api/config');
        const data = await response.json();
        const starterId = data.plans?.starter?.paypalPlanId;
        const growthId = data.plans?.growth?.paypalPlanId;
        if (!data.paypalClientId || !starterId || !growthId) return;
        const script = document.createElement('script');
        script.src = `https://www.paypal.com/sdk/js?client-id=${encodeURIComponent(data.paypalClientId)}&vault=true&intent=subscription&currency=USD`;
        script.onload = () => {
          if (!window.paypal) return;
          $('cardPanel').hidden = false;
          [['paypal-starter', starterId, 'Starter'], ['paypal-growth', growthId, 'Growth']].forEach(([id, planId, label]) => {
            window.paypal.Buttons({
              style: { layout: 'vertical', shape: 'rect', label: 'subscribe' },
              createSubscription: (data, actions) => actions.subscription.create({ plan_id: planId }),
              onApprove: () => status(`${label} subscription started. Access will activate after provider confirmation.`),
              onError: () => status('Card checkout is temporarily unavailable. Please try again or use a wallet payment.', true),
            }).render(`#${id}`);
          });
        };
        script.onerror = () => {};
        document.head.appendChild(script);
      } catch {}
    }
    $('order').onclick = async () => {
      const method = $('method').value;
      status('Creating wallet payment...');
      const response = await fetch('/api/billing/crypto/order', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: $('name').value, email: $('email').value, plan: $('plan').value, method: $('method').value, referral }) });
      const data = await response.json();
      if (!response.ok) return status(data.error || 'Could not create payment.', true);
      reference = data.reference;
      amountCrypto = data.amountCrypto;
      $('wallet').hidden = false;
      $('wallet').innerHTML = `Send exactly <strong>${data.amountCrypto} ${data.currency}</strong> to:<br><code id="walletAddr" style="user-select:all;word-break:break-all;">${data.walletAddress}</code> <button type="button" id="copyAddr" style="width:auto;padding:4px 10px;margin:0 0 0 6px;display:inline-block;">Copy</button><br>Reference: ${data.reference}`;
      $('copyAddr').onclick = async () => {
        try {
          await navigator.clipboard.writeText(data.walletAddress);
          $('copyAddr').textContent = 'Copied!';
        } catch {
          $('copyAddr').textContent = 'Copy failed';
        }
        setTimeout(() => { $('copyAddr').textContent = 'Copy'; }, 2000);
      };
      $('hashLabel').hidden = false;
      $('hash').hidden = false;
      $('confirm').hidden = false;
      status('Send the amount, then submit the transaction hash.');
    };
    $('confirm').onclick = async () => {
      const response = await fetch('/api/billing/crypto/confirm', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ reference, txHash: $('hash').value.trim(), amount: amountCrypto, plan: $('plan').value, method: $('method').value }) });
      const data = await response.json();
      status(response.ok ? 'Payment submitted. Access starts after verification.' : (data.error || 'Could not submit payment.'), !response.ok);
    };

    const requestedPlan = new URLSearchParams(window.location.search).get('plan');
    if (requestedPlan === 'growth') $('plan').value = 'growth';
    loadPaymentOptions();
    loadCardCheckout();
  </script>
</body>
</html>
