services:
  - type: web
    name: lead-agent-saas
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: lead-agent-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /data/data.db
      - key: TZ
        value: Africa/Nairobi
      - key: CORS_ORIGINS
        value: https://lead-saas-agent.netlify.app,https://agent-6a81dca937d9510b5c359--dispatch-lead-agent.netlify.app
      - key: PUBLIC_APP_URL
        value: https://lead-saas-agent.netlify.app
      - key: BACKUP_DIR
        value: /data/backups
      - key: SESSION_SECRET
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_PLAN_STARTER_MONTHLY
        sync: false
      - key: PAYPAL_PLAN_GROWTH_MONTHLY
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORT_CODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_ENV
        value: sandbox
      - key: MPESA_CALLBACK_URL
        sync: false
      - key: COMPLIANCE_MPESA_NUMBER
        sync: false
      - key: COMPLIANCE_BITCOIN_ADDRESS
        sync: false
      - key: COMPLIANCE_ETHEREUM_ADDRESS
        sync: false
