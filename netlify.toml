[build]
  publish = "public"

[[redirects]]
  from = "/"
  to = "/dashboard-v2.html"
  status = 302
  force = true

[[redirects]]
  from = "/init"
  to = "/"
  status = 301
  force = true

# The frontend is static; the backend runs on the self-hosted production API.
# Point api.dispatchpro.ai at the Oracle VM managed by deploy/setup-server.sh.

[[redirects]]
  from = "/api/*"
  to = "https://api.dispatchpro.ai/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/auth/*"
  to = "https://api.dispatchpro.ai/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/leads/*"
  to = "https://api.dispatchpro.ai/leads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/payments/*"
  to = "https://api.dispatchpro.ai/payments/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "https://api.dispatchpro.ai/health"
  status = 200
  force = true

[[redirects]]
  from = "/ebook/*"
  to = "https://api.dispatchpro.ai/ebook/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), microphone=()"
