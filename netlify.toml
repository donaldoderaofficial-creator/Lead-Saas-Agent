[build]
  publish = "public"

[[redirects]]
  from = "/init"
  to = "/"
  status = 301
  force = true

# Keep the frontend and API on separate deploys so the backend can use its
# persistent data disk and receive payment callbacks reliably.

[[redirects]]
  from = "/api/*"
  to = "https://lead-agent-saas.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/auth/*"
  to = "https://lead-agent-saas.onrender.com/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/leads/*"
  to = "https://lead-agent-saas.onrender.com/leads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/payments/*"
  to = "https://lead-agent-saas.onrender.com/payments/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "https://lead-agent-saas.onrender.com/health"
  status = 200
  force = true

[[redirects]]
  from = "/ebook/*"
  to = "https://lead-agent-saas.onrender.com/ebook/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), microphone=()"
