[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/init"
  to = "/"
  status = 301
  force = true

# Netlify Functions are the canonical backend for the stateless public
# payment/config API. These must stay above the generic /api/* proxy so the
# billing page never depends on the stateful origin being awake.

[[redirects]]
  from = "/api/payments/options"
  to = "/.netlify/functions/payments-options"
  status = 200
  force = true

[[redirects]]
  from = "/api/config"
  to = "/.netlify/functions/public-config"
  status = 200
  force = true

# Stateful endpoints (orders, confirmations, auth, leads) still run on the
# self-hosted production API.

[[redirects]]
  from = "/api/billing/crypto/*"
  to = "https://lead-agent-saas.onrender.com/api/billing/crypto/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://lead-agent-saas.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/auth/*"
  to = "https://lead-agent-saas.onrender.com/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/leads/*"
  to = "https://lead-agent-saas.onrender.com/leads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/payments/*"
  to = "https://lead-agent-saas.onrender.com/payments/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "https://lead-agent-saas.onrender.com/health"
  status = 200
  force = true

[[redirects]]
  from = "/ebook/*"
  to = "https://lead-agent-saas.onrender.com/ebook/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), microphone=()"
