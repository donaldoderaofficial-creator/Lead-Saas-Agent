services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dispatch-pro:latest
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8000
      HOST: 0.0.0.0
      DB_PATH: /data/data.db
      SESSION_DB_PATH: /data/sessions.sqlite
      LEARNING_MODEL_PATH: /data/model-state.json
    ports:
      - "8000:8000"
    volumes:
      - dispatch-pro-data:/data
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/ready').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  backup:
    image: dispatch-pro:latest
    env_file:
      - .env
    environment:
      DB_PATH: /data/data.db
      SESSION_DB_PATH: /data/sessions.sqlite
      LEARNING_MODEL_PATH: /data/model-state.json
      BACKUP_DIR: /data/backups
    volumes:
      - dispatch-pro-data:/data
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    init: true
    entrypoint: ["sh", "-c"]
    command: ["while true; do node scripts/backup-db.js; sleep 21600; done"]

volumes:
  dispatch-pro-data:
    name: dispatch-pro-data
