<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plans & Billing</title>
  <style>
    :root {
      --bg:#0B1220; --panel:#0F1830; --line:#22304F; --text:#E7ECF5; --muted:#8493B3; --signal:#5EEAD4; --amber:#FFB454; --danger:#FF6B6B;
    }
    * { box-sizing:border-box; }
    body {
      margin:0; background:var(--bg); color:var(--text); font-family:Inter, Arial, sans-serif; padding:48px 20px;
    }
    .wrap { max-width:760px; margin:0 auto; }
    .card {
      background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:24px;
    }
    h1 { margin:0 0 16px; }
    .muted { color:var(--muted); }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    label { display:block; margin:12px 0 8px; color:var(--muted); font-size:13px; }
    input, select, button { width:100%; padding:11px; border-radius:8px; border:1px solid var(--line); background:#101b2f; color:var(--text); font:inherit; }
    button { margin-top:16px; background:var(--signal); color:#062421; border:none; cursor:pointer; font-weight:600; }
    .status { margin-top:18px; min-height:20px; color:var(--muted); }
    .box { margin-top:18px; padding:16px; border:1px solid var(--line); border-radius:10px; background:#101b2f; display:none; }
    .wallet-list { display:grid; gap:10px; margin:16px 0; }
    .wallet-row { padding:12px; background:#101b2f; border:1px solid var(--line); border-radius:10px; }
    .wallet-row strong { display:block; margin-bottom:4px; }
    .wallet-row code { display:block; color:var(--signal); word-break:break-all; }
    .wallet-row button { width:auto; margin:8px 0 0; padding:6px 10px; }
    @media (max-width:640px) { .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Plans & Billing</h1>
      <p class="muted">Send BTC or ETH anytime to the permanent addresses below, or create a tracked payment request and submit the transaction hash for review.</p>
      <div id="walletList" class="wallet-list" aria-live="polite"></div>

      <div class="grid">
        <div>
          <label for="name">Name</label>
          <input id="name" placeholder="Your name" />
        </div>
        <div>
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@example.com" />
        </div>
        <div>
          <label for="plan">Plan</label>
          <select id="plan">
            <option value="starter">Starter</option>
            <option value="growth">Growth</option>
          </select>
        </div>
        <div>
          <label for="method">Payment method</label>
          <select id="method">
            <option value="bitcoin">Bitcoin</option>
            <option value="ethereum">Ethereum</option>
          </select>
        </div>
      </div>

      <p id="quoteHint" class="muted" style="margin:10px 0 0;font-size:12px;">Loading live plan-to-crypto quote…</p>
      <button id="order" type="button">Create wallet payment</button>
      <div id="wallet" class="box"></div>
      <label id="txHashLabel" for="txHash" hidden>Transaction hash</label>
      <input id="txHash" placeholder="Paste transaction hash after sending" hidden />
      <button id="confirm" type="button" hidden>Submit payment for review</button>
      <div id="status" class="status"></div>
    </div>
  </div>

  <script src="runtime-config.js"></script>
  <script src="api-base.js"></script>
  <script>
    const plan = new URLSearchParams(window.location.search).get('plan');
    const planField = document.getElementById('plan');
    const orderButton = document.getElementById('order');
    const confirmButton = document.getElementById('confirm');
    const txHashInput = document.getElementById('txHash');
    let liveQuotes = null;
    if (plan === 'growth') planField.value = 'growth';
    let checkout = null;

    const setStatus = (msg, isError = false) => {
      const status = document.getElementById('status');
      status.textContent = msg;
      status.style.color = isError ? '#FF6B6B' : '#8493B3';
    };

    async function loadWalletAddresses() {
      try {
        const response = await window.DispatchAPI.fetchWithRetry('/api/payments/options', { cache: 'no-store' });
        const data = await response.json();
        liveQuotes = data.quotes || null;
        const wallets = [data.providers.bitcoin, data.providers.ethereum]
          .filter((provider) => provider?.enabled && provider.address);
        const list = document.getElementById('walletList');
        list.innerHTML = wallets.map((provider) => `<div class="wallet-row"><strong>${provider.currency} wallet</strong><code>${provider.address}</code><button type="button" data-address="${provider.address}" data-currency="${provider.currency}">Copy ${provider.currency} address</button></div>`).join('');
        list.querySelectorAll('button').forEach((button) => {
          button.addEventListener('click', async () => {
            try {
              await navigator.clipboard.writeText(button.dataset.address);
              button.textContent = 'Copied!';
            } catch {
              button.textContent = 'Copy failed';
            }
            setTimeout(() => { button.textContent = `Copy ${button.dataset.currency} address`; }, 2000);
          });
        });
        for (const option of document.getElementById('method').options) {
          const provider = option.value === 'bitcoin' ? data.providers.bitcoin : data.providers.ethereum;
          option.hidden = !provider?.enabled;
          option.disabled = !provider?.enabled;
        }
      } catch {
        setStatus('Payment options are temporarily unavailable. Please try again later.', true);
      }
      updateQuoteHint();
    }

    function updateQuoteHint() {
      const selectedPlan = document.getElementById('plan').value;
      const method = document.getElementById('method').value;
      const methodLabel = method === 'bitcoin' ? 'BTC' : 'ETH';
      const quote = liveQuotes?.[selectedPlan]?.[method];
      const custom = liveQuotes?.custom?.[method];
      const customUsd = Number(liveQuotes?.custom?.usdMinimum || 10001).toFixed(2);
      const hint = document.getElementById('quoteHint');
      hint.textContent = quote?.amount
        ? `${selectedPlan === 'growth' ? 'Growth' : 'Starter'} is currently ~${quote.amount} ${methodLabel}. Custom starts from $${customUsd} (~${custom?.amount || '—'} ${methodLabel}).`
        : 'Live quote unavailable. Create payment to lock an exact BTC/ETH amount.';
    }

    async function fetchWithTimeout(url, options = {}, timeoutMs = 12000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        return await fetch(url, { ...options, signal: controller.signal });
      } finally {
        clearTimeout(timer);
      }
    }

    loadWalletAddresses();

    orderButton.addEventListener('click', async () => {
      const name = document.getElementById('name').value.trim() || 'Customer';
      const email = document.getElementById('email').value.trim() || 'noreply@example.com';
      const selectedPlan = document.getElementById('plan').value;
      const method = document.getElementById('method').value;
      const walletBox = document.getElementById('wallet');
      orderButton.disabled = true;
      setStatus('Creating wallet payment...');

      try {
        const response = await fetchWithTimeout(window.DispatchAPI.url('/api/billing/crypto/order'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, plan: selectedPlan, method }),
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || 'Unable to create wallet payment.');
        checkout = { ...payload, method, plan: selectedPlan };

        walletBox.innerHTML = `
          Send exactly <strong>${payload.amountCrypto} ${payload.currency}</strong> to:<br>
          <code id="walletAddr" style="user-select:all;word-break:break-all;"></code>
          <button type="button" id="copyAddr" style="width:auto;padding:4px 10px;margin:0 0 0 6px;display:inline-block;">Copy</button><br>
          Reference: <strong></strong>
        `;
        document.getElementById('walletAddr').textContent = payload.walletAddress;
        walletBox.querySelector('strong:last-child').textContent = payload.reference;
        walletBox.style.display = 'block';
        document.getElementById('txHashLabel').hidden = false;
        txHashInput.hidden = false;
        confirmButton.hidden = false;
        document.getElementById('copyAddr').addEventListener('click', async () => {
          const button = document.getElementById('copyAddr');
          try {
            await navigator.clipboard.writeText(payload.walletAddress);
            button.textContent = 'Copied!';
          } catch {
            button.textContent = 'Copy failed';
          }
          setTimeout(() => { button.textContent = 'Copy'; }, 2000);
        });
        setStatus('Send the amount, then submit the transaction hash for review.');
      } catch (error) {
        setStatus(error.message || 'Unable to create wallet payment.', true);
      } finally {
        orderButton.disabled = false;
      }
    });

    confirmButton.addEventListener('click', async () => {
      if (!checkout) return;
      confirmButton.disabled = true;
      setStatus('Submitting payment for review...');

      try {
        const response = await fetchWithTimeout(window.DispatchAPI.url('/api/billing/crypto/confirm'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            reference: checkout.reference,
            txHash: txHashInput.value.trim(),
            amount: checkout.amountCrypto,
            plan: checkout.plan,
            method: checkout.method,
          }),
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || 'Unable to submit payment.');
        setStatus(payload.message || 'Payment submitted. Access starts after verification.');
        confirmButton.hidden = true;
      } catch (error) {
        setStatus(error.message || 'Unable to submit payment.', true);
      } finally {
        confirmButton.disabled = false;
      }
    });
    document.getElementById('plan').addEventListener('change', updateQuoteHint);
    document.getElementById('method').addEventListener('change', updateQuoteHint);
  </script>
</body>
</html>
