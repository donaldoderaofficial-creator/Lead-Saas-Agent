name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests and syntax checks
        run: npm test

      - name: Smoke test deployment readiness gate
        env:
          SESSION_SECRET: ci-only-session-secret-with-at-least-32-characters
          DB_PATH: /tmp/lead-agent-ci.db
          NODE_ENV: production
          PUBLIC_APP_URL: https://example.com
          CORS_ORIGINS: https://example.com
          BITCOIN_WALLET_ADDRESS: ci-only-bitcoin-wallet
          ETHEREUM_WALLET_ADDRESS: ci-only-ethereum-wallet
        run: |
          PORT=8000 node server.js > /tmp/lead-agent.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/api/deploy/smoke | grep -q '"status":"ready"'; then
              curl --fail --silent http://127.0.0.1:8000/ready | grep -q '"status":"ready"'
              curl --fail --silent --dump-header /tmp/lead-agent-csrf-headers.txt --output /tmp/lead-agent-csrf-body.json -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/api/csrf-token
              SESSION_COOKIE=$(sed -n 's/^Set-Cookie: \([^;]*\).*/\1/ip' /tmp/lead-agent-csrf-headers.txt | tr -d '\r' | head -n 1)
              CSRF_TOKEN=$(node -e 'let input=""; process.stdin.on("data", (chunk) => input += chunk).on("end", () => process.stdout.write(JSON.parse(input).csrfToken));' < /tmp/lead-agent-csrf-body.json)
              curl --fail --silent -X POST http://127.0.0.1:8000/api/assistant/mia \
                --cookie "$SESSION_COOKIE" \
                -H 'Origin: http://127.0.0.1:8000' \
                -H 'X-Forwarded-Proto: https' \
                -H "X-CSRF-Token: $CSRF_TOKEN" \
                -H 'content-type: application/json' \
                -d '{"question":"Hello Mia"}' | grep -q '"assistant":"Mia"'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/lead-agent.log
          exit 1
