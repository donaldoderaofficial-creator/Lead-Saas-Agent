name: Netlify deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check Netlify secrets
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          missing=0
          for name in NETLIFY_AUTH_TOKEN NETLIFY_SITE_ID; do
            if [ -n "${!name}" ]; then
              echo "::notice::$name secret is set"
            else
              echo "::error::$name secret is not set. Add it under Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          exit $missing

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Netlify
        # --no-build: this repo publishes the static public/ folder as-is and has
        # no build step. Without the flag the CLI runs the site's UI-configured
        # build command, which fails the deploy.
        run: npx --yes netlify-cli deploy --prod --no-build --dir=public --functions=netlify/functions
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
